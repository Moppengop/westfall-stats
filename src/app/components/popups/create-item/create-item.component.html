<div class="popup-backdrop" (click)="cancelled.emit()">
	<section class="create-item-popup" role="dialog" aria-modal="true"
		aria-labelledby="create-item-title" (click)="$event.stopPropagation()">
		<div class="popup-header">
			<h2 id="create-item-title">Create item</h2>
			<button type="button" aria-label="Close" (click)="cancelled.emit()">&times;</button>
		</div>

		<form #itemForm="ngForm" (ngSubmit)="submit()">
			<label>
				Name
				<input type="text" name="name" [(ngModel)]="name" required autofocus />
			</label>

			<label>
				Sell price (copper)
				<input type="number" name="sellPrice" [(ngModel)]="sellPrice" min="0" required />
			</label>

			<div class="popup-actions">
				<button type="button" (click)="cancelled.emit()">Cancel</button>
				<button type="submit" [disabled]="itemForm.invalid">Done</button>
			</div>
		</form>
	</section>
</div>
