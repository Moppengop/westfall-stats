<div class="popup-backdrop" (click)="cancelled.emit()">
	<section class="create-enemy-popup" role="dialog" aria-modal="true" 
    aria-labelledby="create-enemy-title" (click)="$event.stopPropagation()">
		<div class="popup-header">
			<h2 id="create-enemy-title">Create enemy</h2>
			<button type="button" aria-label="Close" (click)="cancelled.emit()">&times;</button>
		</div>

		<form #enemyForm="ngForm" (ngSubmit)="submit()">
			<label>
				Name
				<input type="text" name="name" [(ngModel)]="name" required autofocus />
			</label>

			<label>
				Level
				<input type="number" name="level" [(ngModel)]="level" min="1" required />
			</label>

			<label>
				Health
				<input type="number" name="health" [(ngModel)]="health" min="1" required />
			</label>

			<div class="popup-actions">
				<button type="button" (click)="cancelled.emit()">Cancel</button>
				<button type="submit" [disabled]="enemyForm.invalid">Done</button>
			</div>
		</form>
	</section>
</div>
