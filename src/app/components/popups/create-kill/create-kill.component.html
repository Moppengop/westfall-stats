<div class="popup-backdrop" (click)="cancelled.emit()">
  <section class="create-kill-popup" role="dialog" aria-modal="true"
    aria-labelledby="create-kill-title" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <h2 id="create-kill-title">{{ fixedEnemy ? 'Add chest' : 'Add kill' }}</h2>
      <button type="button" aria-label="Close" (click)="cancelled.emit()">&times;</button>
    </div>

    <form #killForm="ngForm" (ngSubmit)="submit()">
      @if (fixedEnemy; as enemy) {
        <label>
          Enemy
          <input type="text" [value]="enemy.name + ' (level ' + enemy.level + ')'" disabled />
        </label>
      } @else {
        <label>
          Enemy
          <select name="enemy" [(ngModel)]="selectedEnemy" required>
            <option [ngValue]="null">Select an enemy</option>
            @for (enemy of enemies; track enemy.id) {
              <option [ngValue]="enemy">{{ enemy.name }} (level {{ enemy.level }})</option>
            }
          </select>
        </label>
      }

      <div class="drops-header">
        <h3>Drops</h3>
        <button type="button" (click)="addItemRow()">Add item</button>
      </div>

      <label>
        Dropped money (copper)
        <input type="number" name="droppedMoney" [(ngModel)]="droppedMoney" min="0" />
      </label>

      @for (row of itemRows; track $index) {
        <div class="item-row">
          <select [name]="'item-' + $index" [(ngModel)]="row.item">
            <option [ngValue]="null">Select an item</option>
            @for (item of sortedItems; track item.id) {
              <option [ngValue]="item">{{ item.name }}</option>
            }
          </select>

          <input
            type="number"
            [name]="'amount-' + $index"
            [(ngModel)]="row.amount"
            min="1"
            placeholder="Amount"
          />
          <button type="button" aria-label="Remove item" (click)="removeItemRow($index)">&times;</button>
        </div>
      }

      <div class="popup-actions">
        <button type="button" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" [disabled]="killForm.invalid || isSubmitDisabled">Done</button>
      </div>
    </form>
  </section>
</div>
