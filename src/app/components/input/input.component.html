<main class="workspace">
  <aside class="input-root" aria-labelledby="input-title">
    <header class="input-header">
      <p class="eyebrow">WESTFALL STATS</p>
      <h1 id="input-title">Input</h1>
    </header>

    <div class="create-actions">
      <button type="button" (click)="isCreateEnemyOpen = true">Create enemy</button>
      <button type="button" (click)="isCreateItemOpen = true">Create item</button>
    </div>
    <div class="kill-action">
      <button type="button" class="add-kill-button" (click)="isCreateKillOpen = true">Add kill</button>
    </div>
    <details class="backup-menu">
      <summary>Back up data</summary>
      <div class="backup-actions">
        <button type="button" (click)="exportBackup()">Export JSON</button>
        <button type="button" (click)="backupFile.click()">Import JSON</button>
        <input #backupFile type="file" accept=".json,application/json" (change)="importBackup($event)" hidden />
      </div>
    </details>
    @if (backupMessage) {
      <p class="backup-message" aria-live="polite">{{ backupMessage }}</p>
    }

    @if (isCreateEnemyOpen) {
      <app-create-enemy (submitted)="createEnemy($event)" (cancelled)="isCreateEnemyOpen = false" />
    }
    @if (isCreateItemOpen) {
      <app-create-item (submitted)="createItem($event)" (cancelled)="isCreateItemOpen = false" />
    }
    @if (isCreateKillOpen) {
      <app-create-kill
        [enemies]="knownEnemies"
        [items]="knownItems"
        (submitted)="createKill($event)"
        (cancelled)="isCreateKillOpen = false"
      />
    }

    <div class="catalog-list">
      <section class="card-group" aria-labelledby="enemies-title">
        <h2 id="enemies-title">Known enemies</h2>
        @for (enemy of knownEnemies; track enemy.id) {
          <app-enemy-card [enemy]="enemy" />
        }
      </section>

      <section class="card-group" aria-labelledby="items-title">
        <h2 id="items-title">Known items</h2>
        @for (item of knownItems; track item.id) {
          <app-item-card [item]="item" />
        }
      </section>
    </div>

  </aside>

  <app-stats />
</main>
